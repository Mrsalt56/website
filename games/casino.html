<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>casino</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #startBtn {
      position: absolute;
      z-index: 10;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: #4cafef;
      color: white;
    }
  </style>
</head>
<body>
  <button id="startBtn">Start Game</button>

  <iframe 
    id="gameFrame"
    src="https://html5.gamedistribution.com/f00c87c2709248d3a81b6de1f74118f5/?locale=en" 
    title="casino"
    allowfullscreen>
  </iframe>

  <script>
    const iframe = document.getElementById("gameFrame");
    const btn = document.getElementById("startBtn");

    function goFullscreen() {
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) { 
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) { 
        iframe.msRequestFullscreen();
      }
    }

    btn.addEventListener("click", () => {
      btn.style.display = "none"; // hide button
      goFullscreen();
    });
  </script>
</body>
</html>
