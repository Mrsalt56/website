<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madness Project Nexus (Classic)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
    }
  </style>
  <!-- Load Ruffle -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="game"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Create a new Ruffle player
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      // Append player to #game div
      document.getElementById("game").appendChild(player);

      // Load your SWF file
      player.load("https://cdn.jsdelivr.net/gh/oldflashgames/games4@630f33f2ea89cfa120d42a0b3d0bf0b1f9edde8f/madness-project-nexus.swf");
    });
  </script>
</body>
</html>
