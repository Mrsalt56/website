<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Linebacker Alley 2 — Play</title>
  <style>
    /* Make the page a true fullscreen iframe container */
    html,body {
      height: 100%;
      margin: 0;
      background: #000;
    }
    /* iframe fills the viewport */
    #game-iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      margin: 0;
      padding: 0;
    }
    /* remove scrollbars on body (if any) */
    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>
  <!-- Replace the src below if you want a different URL -->
  <iframe id="game-iframe"
          src="https://playgamesfreeaz.info/linebackeralley2-00/"
          allowfullscreen
          sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <script>
    // Ensure the iframe always matches the viewport on resize/rotation
    (function () {
      const ifr = document.getElementById('game-iframe');
      function size() {
        ifr.style.width = window.innerWidth + 'px';
        ifr.style.height = window.innerHeight + 'px';
      }
      window.addEventListener('resize', size, {passive:true});
      size();
    })();
  </script>
</body>
</html>
