<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Linebacker Alley 2</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Game iframe -->
  <iframe src="index.html"></iframe>

  <!-- Block redirect attempts -->
  <script>
    const BLOCK_LIST = ["cmug.gitlab", "cmug.gitlab.io"];

    // Override window.open
    const _open = window.open;
    window.open = function(url, ...rest) {
      if (typeof url === "string" && BLOCK_LIST.some(d => url.includes(d))) {
        console.log("Blocked redirect to:", url);
        return null;
      }
      return _open.call(window, url, ...rest);
    };

    // Block clicks with bad hrefs
    document.addEventListener("click", e => {
      let el = e.target;
      while (el) {
        if (el.href && BLOCK_LIST.some(d => el.href.includes(d))) {
          e.preventDefault();
          e.stopImmediatePropagation();
          console.log("Blocked click on href:", el.href);
          return;
        }
        el = el.parentElement;
      }
    }, true);

    // Guard against location redirects
    const _assign = window.location.assign;
    window.location.assign = function(url) {
      if (typeof url === "string" && BLOCK_LIST.some(d => url.includes(d))) {
        console.log("Blocked location.assign to:", url);
        return;
      }
      return _assign.call(window, url);
    };
  </script>
</body>
</html>
