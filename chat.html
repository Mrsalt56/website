<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Salty — Chat</title>

  <!-- Chat-only CSS (no main.css to avoid conflicts) -->
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div class="chat-title-fixed">Salty Chat</div>

  <div class="chat-wrap">
    <aside class="chat-left">
      <div class="chat-user-box" id="userBox"></div>

      <div class="chat-section">
        <h2>Subject Rooms</h2>
        <div class="chat-list" id="roomsList"></div>
      </div>

      <div class="chat-section">
        <h2>
          Groups
          <button id="createGroupBtn" class="chat-btn-small">+ New Group</button>
        </h2>
        <div class="chat-list" id="groupsList"></div>
      </div>

      <div class="chat-section">
        <h2>
          DMs
          <button id="startDmBtn" class="chat-btn-small">+ DM</button>
        </h2>
        <div class="chat-list" id="dmsList"></div>
      </div>

      <div class="chat-section">
        <h2>Online</h2>
        <div id="onlineList" class="chat-small"></div>
      </div>

      <div class="chat-small">
        Accounts = name + password (saved on this device).  
        Username blocks swear words. Admin panel requires KEY= 67614156.
      </div>
    </aside>

    <section class="chat-right">
      <div class="chat-header">
        <div id="currentRoomTitle"><strong>Select a room, group, or DM</strong></div>
        <span id="notifArea" class="chat-notif"></span>
        <div style="flex:1"></div>
        <div id="loggedInAs" class="chat-small"></div>
        <div id="adminArea"></div>
      </div>

      <div class="chat-area" id="chatArea">
        <div class="chat-small">Pick a room, group, or DM on the left to start chatting.</div>
      </div>

      <div class="chat-input-row" id="inputRow" style="display:none">
        <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" />
        <button id="sendBtn">Send</button>
      </div>
    </section>
  </div>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>

  <!-- Chat logic -->
  <script src="chat.js"></script>
</body>
</html>
