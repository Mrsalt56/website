<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madness Project Nexus (Classic)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/somer-sheff-73/xv@main/ruffle.js"></script>
</head>
<body>
  <ruffle-player id="game"></ruffle-player>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
      if (ruffle) {
        const player = document.getElementById("game");
        player.load("https://cdn.jsdelivr.net/gh/oldflashgames/games4@630f33f2ea89cfa120d42a0b3d0bf0b1f9edde8f/madness-project-nexus.swf");
      } else {
        document.body.textContent = "Ruffle failed to load.";
      }
    });
  </script>
</body>
</html>
