<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salty Games</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.2.0/css/all.css">
</head>
<body>
  <!-- HEADER / NAV -->
  <header class="site-header">
    <div class="logo">
      <img src="images/logo.png" alt="Salty Logo">
      <h1>Salty</h1>
    </div>
    <nav class="site-nav">
      <a href="#">Trending</a>
      <a href="#">New</a>
      <a href="#">Action</a>
      <a href="#">Puzzle</a>
      <a href="#">Sports</a>
      <a href="#">Platformer</a>
    </nav>
    <div class="header-buttons">
      <button id="suggestButton">Suggest a Game</button>
      <button id="reportButton">Report a Problem</button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <h2>Play Free Online Games Instantly</h2>
    <p>No ads, no downloads — just games.</p>
    <div class="search">
      <input type="text" placeholder="Search games...">
      <button><i class="fas fa-search"></i></button>
    </div>
  </section>

  <!-- SEARCH RESULTS -->
  <div id="search-results" class="search-results-bar"></div>

  <!-- GAME SECTIONS -->
  <main>
    <section class="games-section">
      <h2>Trending Now</h2>
<div class="game-card" data-genre="platformer" data-popularity="hot" data-link="games/vex7/index.html">
  <img src="images/vex7.jpeg" alt="Vex 7">
  <span class="badge hot">Hot</span>
  <h3>Vex 7</h3>
</div>

<div class="game-card" data-genre="sports" data-popularity="hot" data-link="games/retro-bowl/index.html">
  <img src="images/retro-bowl.jpg" alt="Retro Bowl">
  <span class="badge hot">Hot</span>
  <h3>Retro Bowl</h3>
</div>

<div class="game-card" data-genre="racing" data-popularity="new" data-link="games/drive-mad/index.html">
  <img src="images/drive-mad.jpg" alt="Drive Mad">
  <span class="badge new">New</span>
  <h3>Drive Mad</h3>
</div>
    </section>

    <section class="games-section">
      <h2>New & Featured</h2>
      <div class="games-grid">
        <div class="game-card" data-genre="puzzle" data-popularity="new">
          <img src="images/2048_logo.svg.png" alt="2048">
          <span class="badge new">New</span>
          <h3>2048</h3>
        </div>
        <div class="game-card" data-genre="idle" data-popularity="new">
          <img src="images/bitlife.png.png" alt="Bitlife">
          <span class="badge new">New</span>
          <h3>Bitlife</h3>
        </div>
      </div>
    </section>
  </main>

  <!-- MODALS -->
  <div id="suggestionForm" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Suggest a Game</h2>
      <input type="text" id="gameName" placeholder="Game Name">
      <textarea id="gameDetails" placeholder="Why should we add it?"></textarea>
      <button id="sendSuggestion">Send</button>
    </div>
  </div>

  <div id="reportForm" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Report a Problem</h2>
      <input type="text" id="problemTitle" placeholder="Title of the problem">
      <textarea id="problemDetails" placeholder="Describe the issue..."></textarea>
      <button id="sendReport">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
