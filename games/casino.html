<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Arrow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: black;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    id="gameFrame"
    src="https://html5.gamedistribution.com/f00c87c2709248d3a81b6de1f74118f5/?timestamp=1694194457&amp;countryCode=en&amp;siteid=90&amp;channelid=3&amp;siteLocale=en&amp;locale=en&amp;gd_sdk_referrer_url=https%3A%2F%2Fwww.girlsgogames.com" 
    title="Geometry Arrow"
    allowfullscreen>
  </iframe>

  <script>
    const iframe = document.getElementById("gameFrame");

    // Try to request fullscreen right away
    function goFullscreen() {
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) { // Safari
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) { // IE/Edge
        iframe.msRequestFullscreen();
      }
    }

    window.addEventListener("load", () => {
      goFullscreen();
    });
  </script>
</body>
